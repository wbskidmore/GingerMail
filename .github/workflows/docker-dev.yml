name: Docker Dev Build

# Build and push Docker images for development/testing purposes.
# This runs automatically on pushes to main and can also be triggered manually.
#
# Usage:
#   1. Push to main branch -> builds dev image tagged with commit SHA
#   2. Manual dispatch -> can specify a version tag for the image
#
# Images are pushed to ghcr.io/wbskidmore/gingermail:
#   - main branch -> latest-dev (for testing latest code)
#   - manual trigger with version -> that version tag

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version tag (e.g., 1.0.6-dev)'
        type: string
        required: false
      build_tarball:
        description: 'Export tarball for download (faster, smaller)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch deep history for better versioning if needed
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            # Get version from package.json
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=${VERSION}-dev" >> "$GITHUB_OUTPUT"
            echo "sha_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Browser-accessible convenience image (KasmVNC desktop)
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gingermail:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/gingermail:latest-dev
            ${{ steps.version.outputs.sha_tag && format('ghcr.io/{0}/gingermail:{1}', github.repository_owner, steps.version.outputs.sha_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head commit.timestamp }}
            org.opencontainers.image.authors=williamskidmore
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/gingermail
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Export image tarball
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gingermail
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.tag }}
        if: ${{ github.event.inputs.build_tarball == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p docker-dist
          docker pull "${IMAGE}:${TAG}"
          docker save "${IMAGE}:${TAG}" | gzip > "docker-dist/gingermail-${VERSION}-docker.tar.gz"
          cd docker-dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Sign tarball (cosign blob, keyless)
        if: ${{ github.event.inputs.build_tarball == 'true' }}
        run: |
          set -euo pipefail
          cd docker-dist
          f=$(ls ./*.tar.gz)
          cosign sign-blob --yes \
            --output-signature "${f}.sig" \
            --output-certificate "${f}.pem" \
            "$f"

      - name: Upload Docker artifact
        if: ${{ github.event.inputs.build_tarball == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: gingermail-docker-dev
          if-no-files-found: error
          path: docker-dist/*

outputs:
  version: ${{ steps.version.outputs.tag }}
  digest: ${{ steps.build.outputs.digest }}