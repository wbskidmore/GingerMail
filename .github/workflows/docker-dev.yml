name: Docker Dev Build

# Build and push Docker images for development/testing purposes.
# This runs automatically on pushes to main and can also be triggered manually.
#
# Usage:
#   1. Push to main branch -> builds dev image tagged with package version + -dev
#   2. Manual dispatch -> can specify a version tag for the image
#
# Images are pushed to ghcr.io/<owner>/gingermail:
#   - main branch -> <version>-dev and latest-dev
#   - manual trigger with version -> that version tag

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version tag (e.g., 1.0.7-dev)'
        type: string
        required: false
      build_tarball:
        description: 'Export tarball for download (faster, smaller)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version
        id: version
        run: |
          set -euo pipefail
          # ghcr.io repository names must be lowercase.
          image="ghcr.io/$(echo '${{ github.repository_owner }}/gingermail' | tr '[:upper:]' '[:lower:]')"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
            tags="${image}:${tag}"$'\n'"${image}:latest-dev"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION=$(node -p "require('./package.json').version")
            if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
              echo "::error::package.json version is empty; cannot tag Docker image"
              exit 1
            fi
            tag="${VERSION}-dev"
            sha_tag="sha-${GITHUB_SHA:0:12}"
            tags="${image}:${tag}"$'\n'"${image}:latest-dev"$'\n'"${image}:${sha_tag}"
          else
            tag="sha-${GITHUB_SHA:0:12}"
            tags="${image}:${tag}"
          fi

          if [ -z "$tag" ]; then
            echo "::error::Resolved Docker tag is empty"
            exit 1
          fi
          {
            echo "image=$image"
            echo "tag=$tag"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Docker tags -> ${tags//$'\n'/ }"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Export image tarball
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.tag }}
        if: ${{ github.event.inputs.build_tarball == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p docker-dist
          docker pull "${IMAGE}:${TAG}"
          docker save "${IMAGE}:${TAG}" | gzip > "docker-dist/gingermail-${VERSION}-docker.tar.gz"
          cd docker-dist
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Sign tarball (cosign blob, keyless)
        if: ${{ github.event.inputs.build_tarball == 'true' }}
        run: |
          set -euo pipefail
          cd docker-dist
          f=$(ls ./*.tar.gz)
          cosign sign-blob --yes \
            --output-signature "${f}.sig" \
            --output-certificate "${f}.pem" \
            "$f"

      - name: Upload Docker artifact
        if: ${{ github.event.inputs.build_tarball == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: gingermail-docker-dev
          if-no-files-found: error
          path: docker-dist/*
